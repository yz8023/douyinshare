name: Release

# 打 tag（如 v1.0.0）时自动签名打包，并把 APK 挂到 GitHub Release。
#
# 需要先在仓库 Settings → Secrets and variables → Actions 里配置这 4 个 Secret：
#   RELEASE_KEYSTORE_BASE64   密钥库文件的 Base64（生成方法见 README「发布正式包」）
#   RELEASE_STORE_PASSWORD    密钥库口令
#   RELEASE_KEY_ALIAS         密钥别名
#   RELEASE_KEY_PASSWORD      密钥口令
#
# 没有密钥库也想要一个能装的包？用 main 分支 CI 里产出的 debug APK 即可
# （Actions → Build → 对应 run 的 Artifacts）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '21'
  NDK_VERSION: '28.2.13676358'
  CMAKE_VERSION: '3.22.1'

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Decode signing keystore when available
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Use unsigned debug fallback when no signing secret is configured
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 == '' }}
        run: echo "No release keystore configured; publishing the tested debug APK."

      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "app versionName = $VERSION_NAME, tag = ${GITHUB_REF_NAME}"
          if [ "v$VERSION_NAME" != "${GITHUB_REF_NAME}" ]; then
            echo "::warning::tag ${GITHUB_REF_NAME} 与 app/build.gradle.kts 的 versionName ($VERSION_NAME) 不一致，建议保持一致"
          fi

      - name: Assemble signed release APK
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Assemble debug APK fallback
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 == '' }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          if [ "${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}" = "true" ]; then
            APK=app/build/outputs/apk/release/app-release.apk
            APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort | tail -1)
            "$APKSIGNER" verify --print-certs "$APK"
          else
            APK=app/build/outputs/apk/debug/app-debug.apk
          fi
          test -f "$APK" || { echo "::error::没有产出 $APK"; exit 1; }
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && 'app/build/outputs/apk/release/*.apk' || 'app/build/outputs/apk/debug/*.apk' }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}" = "true" ]; then
            APK=app/build/outputs/apk/release/app-release.apk
          else
            APK=app/build/outputs/apk/debug/app-debug.apk
          fi
          NOTES="$RUNNER_TEMP/notes.md"
          DISCLAIMER_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/DISCLAIMER.md"
          SERVER_DOC_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/server/README.md"
          # 用 echo 逐行写，避免 heredoc 在 YAML 里的缩进被当成 Markdown 代码块
          {
            echo "> ⚠️ **仅供学习与研究使用。** 使用前请先阅读 [DISCLAIMER.md](${DISCLAIMER_URL})。"
            echo "> 请勿用于商业用途，或用于侵犯他人著作权、违反平台服务条款的行为。"
            echo ""
            echo "## ⚠️ 使用前必读"
            echo ""
            echo "本 App 的解析逻辑**全部在服务端**，安装后必须先配置你自己的服务端才能使用："
            echo ""
            echo "1. 按 [server/README.md](${SERVER_DOC_URL}) 在你自己的虚拟主机上部署 PHP 服务端；"
            echo "2. 打开 App → **设置 → 服务器配置**，填入你的服务端地址、API Token、HMAC 密钥；"
            echo "3. 点「测试连接」确认通过后即可使用。"
            echo ""
            echo "未配置服务端时，解析会提示「未配置服务器」。"
            if [ "${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}" != "true" ]; then
              echo ""
              echo "> 本次仓库未配置发布签名密钥，附件为 CI 构建的 debug APK，仅用于测试安装。"
            fi
            echo ""
            echo "## 安装"
            echo ""
            echo '下载下方 `app-release.apk` 安装。仅支持 `arm64-v8a`，需要 Android 7.0（API 24）及以上。'
          } > "$NOTES"

          # 幂等：重跑工作流时 Release 可能已存在，此时改为覆盖 APK
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} 已存在，改为覆盖其中的 APK"
            gh release upload "${GITHUB_REF_NAME}" "$APK" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "$APK" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "$NOTES" \
              --verify-tag
          fi
